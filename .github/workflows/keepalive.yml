# Supabase met en pause les projets gratuits sans activité pendant 7 jours.
# Cette petite tâche interroge la base une fois par jour pour la garder éveillée.
name: Garder Supabase éveillé

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base
        run: |
          curl -fsS "https://hzpixgfuzocoxwtqhqzh.supabase.co/rest/v1/found?select=place_id&limit=1" \
            -H "apikey: sb_publishable_I4hIbIwAOWW9_Jcconlvig_-ZL0lVa3" -o /dev/null -w "HTTP %{http_code}\n"
